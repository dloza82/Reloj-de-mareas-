<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=4.0">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Reloj de Mareas">
<title>Reloj de Mareas · Gijón</title>
<link rel="manifest" href="manifest.json">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #0a0a0a;
  position: fixed;
  top: 0; left: 0;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}
body { display: flex; align-items: center; justify-content: center; }
canvas { display: block; position: fixed; top: 0; left: 0; }

/* ── TARJETA INFERIOR ── */
#info-card {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(10,10,10,0.92);
  border-top: 1px solid rgba(255,255,255,0.07);
  backdrop-filter: blur(8px);
  z-index: 20;
  font-family: 'Inconsolata', monospace;
  overflow: hidden;
  transform: translateY(100%);
  transition: transform 0.4s cubic-bezier(.4,0,.2,1);
}
#info-card.visible { transform: translateY(0); }

/* toggle handle */
#card-handle {
  width: 36px; height: 4px;
  background: rgba(255,255,255,0.18);
  border-radius: 2px;
  margin: 8px auto 6px;
  cursor: pointer;
}

/* ── fila sol ── */
.sun-row {
  position: relative;
  height: 60px;
  background: linear-gradient(180deg, #08080f 0%, #131020 60%, #0d1520 100%);
  overflow: hidden;
}
.sun-row::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%, rgba(255,255,255,0.07) 20%,
    rgba(255,255,255,0.14) 50%,
    rgba(255,255,255,0.07) 80%, transparent 100%);
}
.sun-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.arc-track { fill:none; stroke:rgba(255,255,255,0.06); stroke-width:1; stroke-dasharray:3 7; }
.arc-done  { fill:none; stroke:#f0c060; stroke-width:1; stroke-linecap:round; opacity:0.65; }
.sun-dot   { fill:#f0c060; filter:drop-shadow(0 0 6px rgba(240,192,96,0.85)); }
@keyframes sunpulse { 0%,100%{opacity:1} 50%{opacity:.6} }

/* ── fila marea ── */
.tide-row {
  height: 58px;
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 10px;
  background: #090e13;
  border-top: 1px solid rgba(255,255,255,0.05);
}
.tide-side { display:flex; flex-direction:column; gap:2px; flex-shrink:0; }
.tide-side.right { text-align:right; }
.tide-label { font-size:0.52rem; letter-spacing:0.14em; text-transform:uppercase; color:rgba(255,255,255,0.28); }
.tide-time  { font-size:0.78rem; color:rgba(255,255,255,0.6); }
.tide-m     { font-size:0.58rem; color:rgba(255,255,255,0.28); }
.tide-bar-outer { flex:1; display:flex; flex-direction:column; gap:5px; }
.tide-track {
  position:relative; height:18px;
  background:rgba(255,255,255,0.04); border-radius:2px; overflow:hidden;
}
.tide-fill {
  position:absolute; left:0; top:0; bottom:0;
  background:linear-gradient(90deg,#1e3a52,#5b9fc4);
  border-radius:2px;
  transition:width 1.4s cubic-bezier(.4,0,.2,1);
}
.tide-cursor {
  position:absolute; top:-3px; bottom:-3px; width:2px;
  background:white; border-radius:1px;
  box-shadow:0 0 6px rgba(255,255,255,0.7);
  transform:translateX(-50%);
  transition:left 1.4s cubic-bezier(.4,0,.2,1);
}
.tide-now {
  display:flex; justify-content:center; align-items:center; gap:6px;
}
.tide-now-val { font-size:0.65rem; color:#7ab8d4; letter-spacing:0.04em; }
.tide-now-dir { font-size:0.56rem; color:rgba(255,255,255,0.28); letter-spacing:0.1em; text-transform:uppercase; }

/* ── fila luna ── */
.moon-row {
  height: 52px;
  display:flex; align-items:center; justify-content:space-between;
  padding: 0 14px;
  border-top: 1px solid rgba(255,255,255,0.05);
}
.moon-left { display:flex; align-items:center; gap:10px; }
.moon-svg-wrap { width:26px; height:26px; flex-shrink:0; }
.moon-name { font-size:0.82rem; color:#c8d8f0; letter-spacing:0.03em; }
.moon-pct  { font-size:0.56rem; color:rgba(255,255,255,0.28); letter-spacing:0.1em; margin-top:2px; }
.lunar-dots { display:flex; gap:3px; align-items:center; }
.ldot {
  width:5px; height:5px; border-radius:50%;
  background:rgba(200,216,240,0.1); border:1px solid rgba(200,216,240,0.18);
}
.ldot.on { background:#c8d8f0; border-color:#c8d8f0; box-shadow:0 0 4px #c8d8f0; }
</style>

<body>
<canvas id="c"></canvas>

<!-- TARJETA INFERIOR: sol, marea, luna -->
<div id="info-card">
  <div id="card-handle"></div>

  <!-- SOL -->
  <div class="sun-row">
    <svg class="sun-svg" id="sunSvg" viewBox="0 0 360 60" preserveAspectRatio="none">
      <path class="arc-track" id="arcTrack" d=""/>
      <path class="arc-done"  id="arcDone"  d=""/>
      <circle class="sun-dot" id="sunDot" r="4" cx="180" cy="10"
              style="animation:sunpulse 3s ease-in-out infinite"/>
      <text id="sunRiseTxt" x="8"   y="56" font-family="Inconsolata,monospace" font-size="7"
            fill="rgba(255,255,255,.3)" letter-spacing="0.8">--:--</text>
      <text id="sunSetTxt"  x="352" y="56" font-family="Inconsolata,monospace" font-size="7"
            fill="rgba(255,255,255,.3)" letter-spacing="0.8" text-anchor="end">--:--</text>
    </svg>
  </div>

  <!-- MAREA -->
  <div class="tide-row">
    <div class="tide-side left">
      <span class="tide-label" id="tideLeftLabel">bajamar</span>
      <span class="tide-time"  id="tideLeftTime">--:--</span>
      <span class="tide-m"     id="tideLeftM">-- m</span>
    </div>
    <div class="tide-bar-outer">
      <div class="tide-track">
        <div class="tide-fill"   id="tideFill"></div>
        <div class="tide-cursor" id="tideCursor"></div>
      </div>
      <div class="tide-now">
        <span class="tide-now-val" id="tideNowVal">-- m</span>
        <span class="tide-now-dir" id="tideNowDir">--</span>
      </div>
    </div>
    <div class="tide-side right">
      <span class="tide-label" id="tideRightLabel">pleamar</span>
      <span class="tide-time"  id="tideRightTime">--:--</span>
      <span class="tide-m"     id="tideRightM">-- m</span>
    </div>
  </div>

  <!-- LUNA -->
  <div class="moon-row">
    <div class="moon-left">
      <div class="moon-svg-wrap">
        <svg id="moonSvg" viewBox="0 0 30 30" fill="none">
          <circle cx="15" cy="15" r="12" fill="rgba(200,216,240,0.07)"
                  stroke="rgba(200,216,240,0.2)" stroke-width="0.5"/>
          <path id="moonPath" d=""/>
          <circle cx="15" cy="15" r="12" fill="none"
                  stroke="rgba(200,216,240,0.3)" stroke-width="0.5"/>
        </svg>
      </div>
      <div>
        <div class="moon-name" id="moonName">--</div>
        <div class="moon-pct"  id="moonPct">-- % iluminada</div>
      </div>
    </div>
    <div class="lunar-dots" id="lunarDots"></div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// CONSTANTES
// ─────────────────────────────────────────────────────────────────────────────
const COLS = 8, ROWS = 8, TOTAL = COLS * ROWS;
const LAT = 43.545, LON = -5.668;

// La clave de caché incluye versión. Cambiarla fuerza refresco en todos los
// dispositivos aunque tengan datos viejos de una versión anterior.
const CACHE_KEY = 'mareas_v10';

// TTL de 6 horas: las mareas cambian ~cada 6h, refresco suficiente sin abusar
const CACHE_TTL = 6 * 60 * 60 * 1000;

// Limpiar claves de versiones anteriores que ya no se usan
try { ['mareas_v9', 'mareas_v8', 'mareas_v7', 'mareas_v6', 'mareas_v5'].forEach(k => localStorage.removeItem(k)); } catch(e) {}

// makeSignal() con fallback para Android/browsers antiguos (Chrome <103)
function makeSignal(ms) {
  if (typeof AbortSignal.timeout === 'function') return AbortSignal.timeout(ms);
  const ctrl = new AbortController();
  setTimeout(() => ctrl.abort(), ms);
  return ctrl.signal;
}

// ─────────────────────────────────────────────────────────────────────────────
// CANVAS Y DIMENSIONES
// ─────────────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let SIZE, GAP, LIFT, PAD, W, H;

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const margin = Math.min(vw, vh) * 0.04;
  SIZE = Math.floor(Math.min((vw - margin * 2) / COLS, (vh - margin * 2) / (ROWS + 0.5)));
  GAP  = Math.max(2, Math.round(SIZE * 0.08));
  SIZE = Math.floor((vw - margin * 2 - (COLS - 1) * GAP) / COLS);
  LIFT = Math.round(SIZE * 0.25);
  PAD  = margin;
  W = vw; H = vh;
  canvas.width  = W; canvas.height  = H;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));

// ─────────────────────────────────────────────────────────────────────────────
// PALETAS
// ─────────────────────────────────────────────────────────────────────────────
const PALETTES = [
  { on:[25,70,140],    off:[155,205,235], flash:[230,248,255] },
  { on:[78,185,170],   off:[180,220,210], flash:[230,250,245] },
  { on:[162,90,180],   off:[210,170,220], flash:[240,225,245] },
  { on:[245,185,175],  off:[250,220,210], flash:[255,245,240] },
  { on:[235,220,50],   off:[245,240,155], flash:[255,252,220] },
  { on:[210,95,155],   off:[245,190,215], flash:[255,235,245] },
  { on:[155,145,135],  off:[200,195,190], flash:[235,232,230] },
  { on:[200,195,190],  off:[225,222,218], flash:[245,243,241] },
];
let paletteIndex = 0;
let _swipeConsumed = false; // declarado aquí para que el click listener pueda accederlo
canvas.style.cursor = 'pointer';
canvas.addEventListener('click', () => {
  if (_swipeConsumed) { _swipeConsumed = false; return; }
  paletteIndex = (paletteIndex + 1) % PALETTES.length;
});
function getColors() { return PALETTES[paletteIndex]; }

// ─────────────────────────────────────────────────────────────────────────────
// ESTADO DE MAREA
// ─────────────────────────────────────────────────────────────────────────────
let tideData = null;  // { lastTs, nextTs, cycleTotal, rising, source }
let waveHeightM  = 1.0;  // altura de ola en metros (Cantábrico: 0.5–4m)
let wavePeriodMs = 2500; // velocidad de animación en ms por ciclo visual

// Flag para evitar disparar fetchMarineData() múltiples veces desde el loop
// de render. Sin esto, computeLitCount() lo llamaría 60 veces/segundo.
let _fetchingInProgress = false;

//   Subiendo (rising=true):  frac 0→1  →  litCount 0→64  (oscuro sube)
//   Bajando  (rising=false): frac 0→1  →  litCount 64→0  (oscuro baja)
function computeLitCount() {
  if (!tideData) return 32;

  // Si hemos superado nextTs, el ciclo terminó.
  // Disparar re-fetch UNA sola vez (no 60 veces/segundo).
  if (Date.now() > tideData.nextTs) {
    if (!_fetchingInProgress) {
      _fetchingInProgress = true;
      fetchMarineData().finally(() => { _fetchingInProgress = false; });
    }
    return tideData.rising ? 64 : 0;  // mantener estado final hasta que lleguen datos nuevos
  }

  const frac = Math.max(0, Math.min(1, (Date.now() - tideData.lastTs) / tideData.cycleTotal));
  return tideData.rising
    ? Math.round(frac * 64)          // subiendo: oscuro crece de 0 a 64
    : Math.round((1 - frac) * 64);   // bajando:  oscuro decrece de 64 a 0
}

// ─────────────────────────────────────────────────────────────────────────────
// UTILIDADES DE FECHA
// ─────────────────────────────────────────────────────────────────────────────
function fmtDate(d) {
  // Devuelve YYYYMMDD en hora LOCAL (necesario para IHM que trabaja en hora española)
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}

function fmt(ts) {
  return new Date(ts).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
}

// ─────────────────────────────────────────────────────────────────────────────
// PROCESAR EXTREMOS: lógica común a todas las fuentes
// ─────────────────────────────────────────────────────────────────────────────
function processTideExtremes(extremes, source) {
  const nowMs = Date.now();
  extremes.sort((a, b) => a.ts - b.ts);

  // Filtrar extremos muy viejos (más de 13h en el pasado) o muy lejanos (más de 13h en el futuro)
  // para no coger un extremo equivocado si la lista tiene datos de días anteriores
  const window13h = 13 * 3600 * 1000;
  const relevant = extremes.filter(e => e.ts > nowMs - window13h && e.ts < nowMs + window13h);

  const past   = relevant.filter(e => e.ts <= nowMs);
  const future = relevant.filter(e => e.ts >  nowMs);

  if (!past.length || !future.length) {
    console.warn(`[${source}] no hay par último/próximo en ventana ±13h. Extremos:`,
      extremes.map(e => `${e.type}@${fmt(e.ts)}`).join(' '));
    return false;
  }

  const last = past[past.length - 1];
  const next = future[0];

  // Sanidad: el ciclo debe estar entre 5h y 8h (rango real de mareas)
  const cycle = next.ts - last.ts;
  if (cycle < 4.5 * 3600000 || cycle > 8 * 3600000) {
    console.warn(`[${source}] ciclo anómalo: ${Math.round(cycle/60000)}min. Descartado.`);
    return false;
  }

  tideData = {
    lastTs:     last.ts,
    nextTs:     next.ts,
    cycleTotal: cycle,
    rising:     next.type === 'High',
    lastHeight: last.height != null ? last.height : null,
    nextHeight: next.height != null ? next.height : null,
    source
  };

  console.log(`[${source}] ${last.type}@${fmt(last.ts)} → ${next.type}@${fmt(next.ts)} | ${tideData.rising ? '↑' : '↓'} | ciclo=${Math.round(cycle/60000)}min`);
  updateCard();
  return true;
}

// ─────────────────────────────────────────────────────────────────────────────
// FUENTE 1: Stormglass API — CORS nativo, sin proxy, datos precisos por coordenada
// Plan gratuito: 10 requests/día. Con caché de 6h → máx 4 requests/día.
// Devuelve extremos de marea (horas exactas de pleamar/bajamar).
// ─────────────────────────────────────────────────────────────────────────────
async function fetchStormglass() {
  const key = '465b185a-2b64-11f1-a882-0242ac120004-465b18c8-2b64-11f1-a882-0242ac120004';

  // Pedimos desde hace 13h hasta dentro de 14h
  // -13h garantiza que siempre hay al menos un extremo pasado (ciclo máximo ~6.5h × 2)
  // Stormglass requiere formato ISO 8601, no Unix timestamps
  const start = new Date(Date.now() - 13 * 3600000).toISOString();
  const end   = new Date(Date.now() + 14 * 3600000).toISOString();

  const url = `https://api.stormglass.io/v2/tide/extremes/point`
    + `?lat=${LAT}&lng=${LON}&start=${start}&end=${end}`;

  try {
    const res = await fetch(url, {
      headers: { 'Authorization': key },
      signal: makeSignal(10000)
    });
    if (!res.ok) throw new Error(`Stormglass HTTP ${res.status}`);
    const data = await res.json();

    if (!data.data?.length) {
      console.warn('[Stormglass] respuesta vacía');
      return null;
    }

    // Stormglass devuelve: [{ time: "2026-04-07T08:06:00+00:00", height: 1.8, type: "high" }, ...]
    const extremes = data.data.map(e => ({
      ts:     new Date(e.time).getTime(),
      type:   e.type === 'high' ? 'High' : 'Low',
      height: e.height != null ? Math.round(e.height * 10) / 10 : null
    })).filter(e => !isNaN(e.ts));

    if (extremes.length < 2) {
      console.warn('[Stormglass] extremos insuficientes:', extremes.length);
      return null;
    }

    console.log(`[Stormglass] extremos: ${extremes.map(e => `${e.type}@${fmt(e.ts)}`).join(' ')}`);
    return { extremes, source: 'Stormglass' };
  } catch(err) {
    console.warn('[Stormglass]', err.message);
    return null;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// FUENTE 2: IHM directo HTTPS
// La API del IHM Armada española sí permite CORS desde HTTPS.
// Pedimos hoy Y mañana para asegurar que siempre hay un extremo futuro.
// ─────────────────────────────────────────────────────────────────────────────
async function fetchIHM_direct() {
  const today    = fmtDate(new Date());
  const tomorrowD = new Date(); tomorrowD.setDate(tomorrowD.getDate() + 1);
  const tomorrow = fmtDate(tomorrowD);
  const base = 'https://ideihm.covam.es/api-ihm/getmarea?REQUEST=gettide&PORT=gijon&FORMAT=json';
  try {
    const [r1, r2] = await Promise.all([
      fetch(`${base}&DATE=${today}`,    { signal: makeSignal(8000) }),
      fetch(`${base}&DATE=${tomorrow}`, { signal: makeSignal(8000) }),
    ]);
    if (!r1.ok || !r2.ok) throw new Error(`HTTP ${r1.status}/${r2.status}`);
    const [d1, d2] = await Promise.all([r1.json(), r2.json()]);
    return parseIHMData([...(d1.data || []), ...(d2.data || [])], 'IHM-direct');
  } catch(err) {
    console.warn('[IHM-direct]', err.message);
    return null;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// FUENTE 2: IHM vía proxy allorigins
// Fallback cuando IHM-direct falla por CORS o red.
// CORRECCIÓN: usamos HTTPS en la URL original también (allorigins acepta ambas
// pero HTTPS es más fiable).
// ─────────────────────────────────────────────────────────────────────────────
async function fetchIHM_proxy() {
  const today    = fmtDate(new Date());
  const tomorrowD = new Date(); tomorrowD.setDate(tomorrowD.getDate() + 1);
  const tomorrow = fmtDate(tomorrowD);
  // CORRECCIÓN BUG #4: URL base en HTTPS, no HTTP
  const base = 'https://ideihm.covam.es/api-ihm/getmarea?REQUEST=gettide&PORT=gijon&FORMAT=json';
  const proxy = u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`;
  try {
    const [r1, r2] = await Promise.all([
      fetch(proxy(`${base}&DATE=${today}`),    { signal: makeSignal(10000) }),
      fetch(proxy(`${base}&DATE=${tomorrow}`), { signal: makeSignal(10000) }),
    ]);
    if (!r1.ok || !r2.ok) throw new Error(`proxy HTTP ${r1.status}/${r2.status}`);
    const [j1, j2] = await Promise.all([r1.json(), r2.json()]);
    const d1 = JSON.parse(j1.contents);
    const d2 = JSON.parse(j2.contents);
    return parseIHMData([...(d1.data || []), ...(d2.data || [])], 'IHM-proxy');
  } catch(err) {
    console.warn('[IHM-proxy]', err.message);
    return null;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// PARSER IHM (compartido por direct y proxy)
// Formato IHM: { fecha:"DD/MM/YYYY", hora:"HH:MM", altura:"X.XX", marea:"pleamar"|"bajamar" }
// Los timestamps IHM ya vienen en hora oficial española (Europe/Madrid, con cambio de hora).
// new Date("YYYY-MM-DDTHH:MM") sin Z → JS lo trata como hora local del dispositivo.
// Si el dispositivo está en Europe/Madrid (como es el caso), es correcto.
// ─────────────────────────────────────────────────────────────────────────────
function parseIHMData(allData, source) {
  const extremes = allData
    .filter(e => e.marea)
    .map(e => {
      const [day, mon, yr] = e.fecha.split('/');
      const ts   = new Date(`${yr}-${mon}-${day}T${e.hora}:00`).getTime();
      const type = e.marea.toLowerCase().includes('plea') ? 'High' : 'Low';
      return { ts, type };
    })
    .filter(e => !isNaN(e.ts));

  if (extremes.length < 2) {
    console.warn(`[${source}] datos insuficientes: ${allData.length} registros`);
    return null;
  }

  console.log(`[${source}] extremos crudos: ${extremes.map(e => `${e.type}@${fmt(e.ts)}`).join(' ')}`);
  return { extremes, source };
}

// ─────────────────────────────────────────────────────────────────────────────
// FUENTE 2b: IHM vía corsproxy.io — segundo proxy independiente
// ─────────────────────────────────────────────────────────────────────────────
async function fetchIHM_proxy2() {
  const today    = fmtDate(new Date());
  const tomorrowD = new Date(); tomorrowD.setDate(tomorrowD.getDate() + 1);
  const tomorrow = fmtDate(tomorrowD);
  const base  = 'https://ideihm.covam.es/api-ihm/getmarea?REQUEST=gettide&PORT=gijon&FORMAT=json';
  const proxy = u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`;
  try {
    const [r1, r2] = await Promise.all([
      fetch(proxy(`${base}&DATE=${today}`),    { signal: makeSignal(10000) }),
      fetch(proxy(`${base}&DATE=${tomorrow}`), { signal: makeSignal(10000) }),
    ]);
    if (!r1.ok || !r2.ok) throw new Error(`proxy2 HTTP ${r1.status}/${r2.status}`);
    const [d1, d2] = await Promise.all([r1.json(), r2.json()]);
    return parseIHMData([...(d1.data || []), ...(d2.data || [])], 'IHM-proxy2');
  } catch(err) {
    console.warn('[IHM-proxy2]', err.message);
    return null;
  }
}


// Datos cada hora en UTC. Detectamos máximos/mínimos con interpolación Catmull-Rom
// para obtener el minuto exacto del extremo.
// CORRECCIÓN BUG #5 (olas): la indexación por hora se hace buscando el timestamp
// correcto en el array, no asumiendo que el índice == hora UTC del día.
// ─────────────────────────────────────────────────────────────────────────────
async function fetchOpenMeteo() {
  const url = `https://marine-api.open-meteo.com/v1/marine`
    + `?latitude=${LAT}&longitude=${LON}`
    + `&hourly=sea_level&timezone=UTC&forecast_days=3`;
  try {
    const res  = await fetch(url, { signal: makeSignal(10000) });
    if (!res.ok) throw new Error(`OM HTTP ${res.status}`);
    const data = await res.json();
    if (!data.hourly?.sea_level) return null;

    const times  = data.hourly.time;
    const levels = data.hourly.sea_level;
    const extremes = [];

    for (let i = 1; i < levels.length - 2; i++) {
      const p0 = levels[i-1], p1 = levels[i], p2 = levels[i+1], p3 = levels[i+2];
      if (p0 == null || p1 == null || p2 == null || p3 == null) continue;

      const isMax = p1 > p0 && p1 >= p2;
      const isMin = p1 < p0 && p1 <= p2;
      if (!isMax && !isMin) continue;

      // Catmull-Rom para encontrar el minuto exacto del extremo
      let bestT = 0, bestVal = p1;
      for (let t = 0; t <= 60; t++) {
        const u = t / 60;
        const v = 0.5 * ((2*p1) + (-p0+p2)*u + (2*p0-5*p1+4*p2-p3)*u*u + (-p0+3*p1-3*p2+p3)*u*u*u);
        if (isMax && v > bestVal) { bestVal = v; bestT = t; }
        if (isMin && v < bestVal) { bestVal = v; bestT = t; }
      }

      // times[i] viene como "2026-04-03T04:00" en UTC → añadir 'Z' explícito
      const baseTs = new Date(times[i] + 'Z').getTime();
      extremes.push({ ts: baseTs + bestT * 60000, type: isMax ? 'High' : 'Low' });
    }

    if (extremes.length < 2) return null;

    console.log(`[OM] extremos: ${extremes.slice(0, 6).map(e => `${e.type}@${fmt(e.ts)}`).join(' ')}`);
    return { extremes, source: 'OM' };
  } catch(err) {
    console.warn('[OM]', err.message);
    return null;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// OLAS — datos de Open-Meteo
// CORRECCIÓN BUG #5: buscamos el índice correcto por timestamp, no por hora UTC cruda.
// ─────────────────────────────────────────────────────────────────────────────
async function fetchWaves() {
  try {
    const url = `https://marine-api.open-meteo.com/v1/marine`
      + `?latitude=${LAT}&longitude=${LON}`
      + `&hourly=wave_height,wave_period&timezone=UTC&forecast_days=1`;
    const res  = await fetch(url, { signal: makeSignal(8000) });
    if (!res.ok) throw new Error(`waves HTTP ${res.status}`);
    const data = await res.json();
    if (!data.hourly?.wave_height || !data.hourly?.time) return;

    const nowUtc = new Date().toISOString().slice(0, 13); // "2026-04-04T14"
    const idx = data.hourly.time.findIndex(t => t.startsWith(nowUtc));
    if (idx < 0) return;

    const wh = data.hourly.wave_height[idx];  // metros
    const wp = data.hourly.wave_period[idx];  // segundos

    // Parámetro 1: velocidad visual escalada según diseño original
    // olas cortas (4s) → animación rápida (1200ms/ciclo)
    // olas largas (16s) → animación lenta (5000ms/ciclo)
    // Interpolación lineal entre esos dos extremos, clampeo fuera de rango
    if (wp != null) {
      const wpClamped = Math.max(4, Math.min(16, wp));
      wavePeriodMs = Math.round(1200 + (wpClamped - 4) / 12 * (5000 - 1200));
    }

    // Parámetro 2: tamaño de animación en metros directamente
    // Cantábrico: 0.5m → 1 píxel, 4m → 8 píxeles
    // Escala natural: wh * 2, clampeo 1–8
    if (wh != null) waveHeightM = wh;
  } catch(e) {
    // olas no son críticas, fallo silencioso
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// CACHÉ — lectura y escritura en localStorage
// CORRECCIÓN BUG #2: se elimina el localStorage.clear() del arranque.
// La caché se respeta entre sesiones. Solo se borra si supera el TTL.
// ─────────────────────────────────────────────────────────────────────────────
function loadCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const cached = JSON.parse(raw);
    if (Date.now() - cached.ts > CACHE_TTL) return null;  // caducada
    return cached;
  } catch(e) {
    return null;
  }
}

function saveCache(extremes, source) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), extremes, source }));
  } catch(e) {}
}

// ORQUESTADOR PRINCIPAL
// Orden: caché → Stormglass → IHM-direct → IHM-proxy → IHM-proxy2 → Open-Meteo → fallback
// Stormglass va primero: CORS nativo, sin proxy, arranque inmediato (~1s)
// ─────────────────────────────────────────────────────────────────────────────
async function fetchMarineData() {
  // Protección: si ya hay una petición en curso, no lanzar otra en paralelo
  if (_fetchingInProgress) return;
  _fetchingInProgress = true;

  try {
    // 1. Intentar caché válida primero
    const cached = loadCache();
    if (cached) {
      const ok = processTideExtremes(cached.extremes, cached.source + '(caché)');
      if (ok) {
        fetchWaves();  // olas siempre frescas, no se cachean
        return;        // el finally SÍ se ejecuta aunque haya return dentro de try
      }
    }

    // 2. Stormglass — primera fuente, CORS nativo, datos exactos
    let result = await fetchStormglass();

    // 3. IHM directo HTTPS
    if (!result) result = await fetchIHM_direct();

    // 4. IHM vía proxy allorigins
    if (!result) result = await fetchIHM_proxy();

    // 5. IHM vía corsproxy.io (proxy alternativo independiente)
    if (!result) result = await fetchIHM_proxy2();

    // 6. Open-Meteo
    if (!result) result = await fetchOpenMeteo();

// ─────────────────────────────────────────────────────────────────────────────
// DEBUG OVERLAY
// ─────────────────────────────────────────────────────────────────────────────
// FÓRMULAS ASTRONÓMICAS — sol y luna sin API externa
// ─────────────────────────────────────────────────────────────────────────────

function sunTimes(dateMs) {
  const rad = Math.PI / 180;
  const JD  = dateMs / 86400000 + 2440587.5;
  const n   = JD - 2451545.0;
  const L   = (280.46 + 0.9856474 * n) % 360;
  const g   = (357.528 + 0.9856003 * n) % 360;
  const lam = L + 1.915 * Math.sin(g * rad) + 0.02 * Math.sin(2 * g * rad);
  const eps = 23.439 - 0.0000004 * n;
  const sinDec = Math.sin(eps * rad) * Math.sin(lam * rad);
  const dec    = Math.asin(sinDec) / rad;
  const cosH   = (Math.sin(-0.833 * rad) - Math.sin(LAT * rad) * Math.sin(dec * rad))
               / (Math.cos(LAT * rad) * Math.cos(dec * rad));
  if (Math.abs(cosH) > 1) return null;
  const H     = Math.acos(cosH) / rad;
  const GMST  = (6.697375 + 0.0657098242 * n) % 24;
  const RA    = Math.atan2(Math.cos(eps * rad) * Math.sin(lam * rad), Math.cos(lam * rad)) / rad / 15;
  const trans = ((RA - GMST - LON / 15) % 24 + 24) % 24;
  // Convertir UTC a hora local del dispositivo (España UTC+2 en verano, UTC+1 en invierno)
  const offsetH = -new Date().getTimezoneOffset() / 60;
  return {
    rise:    (trans - H / 15 + 24 + offsetH) % 24,
    set:     (trans + H / 15 + 24 + offsetH) % 24,
    transit: (trans + offsetH + 24) % 24,
    progUTC: trans - H / 15  // para calcular el progreso del sol en UTC
  };
}

function moonPhase(dateMs) {
  const rad = Math.PI / 180;
  const JD  = dateMs / 86400000 + 2440587.5;
  const T   = (JD - 2451545.0) / 36525;
  const D   = ((297.85036 + 445267.111480 * T - 0.0019142 * T * T) % 360 + 360) % 360;
  const illum = Math.round((1 - Math.cos(D * rad)) / 2 * 100);
  const names = [
    'Luna nueva','Creciente','Cuarto creciente','Gibosa creciente',
    'Luna llena','Gibosa menguante','Cuarto menguante','Menguante'
  ];
  const name = names[Math.round(D / 45) % 8];
  // Fase normalizada 0–1 para dibujar la cara iluminada
  return { illum, name, phase: D / 360 };
}

// ─────────────────────────────────────────────────────────────────────────────
// TARJETA INFERIOR — actualización periódica
// ─────────────────────────────────────────────────────────────────────────────

function hhmm(hFloat) {
  const h = Math.floor(hFloat % 24);
  const m = Math.round((hFloat % 1) * 60);
  return `${String(h).padStart(2,'0')}:${String(m % 60).padStart(2,'0')}`;
}

// Altura interpolada (interpolación coseno = regla del 12avo aproximada)
function tideHeightNowClean() {
  if (!tideData || tideData.lastHeight == null || tideData.nextHeight == null) return null;
  const frac = Math.max(0, Math.min(1, (Date.now() - tideData.lastTs) / tideData.cycleTotal));
  const lo = tideData.rising ? tideData.lastHeight : tideData.nextHeight;
  const hi = tideData.rising ? tideData.nextHeight : tideData.lastHeight;
  // Interpolación coseno: lo + (hi-lo) * (1 - cos(π*frac)) / 2
  return lo + (hi - lo) * (1 - Math.cos(Math.PI * frac)) / 2;
}

function updateCard() {
  if (!tideData) return;

  // ── SOL ──
  const sun = sunTimes(Date.now());
  if (sun) {
    document.getElementById('sunRiseTxt').textContent = hhmm(sun.rise);
    document.getElementById('sunSetTxt').textContent  = hhmm(sun.set);

    // Progreso del sol: 0=amanecer, 1=ocaso
    const nowH = new Date().getHours() + new Date().getMinutes() / 60;
    const prog = Math.max(0, Math.min(1, (nowH - sun.rise) / (sun.set - sun.rise)));

    const W = 360, H = 60;
    const scx = W / 2, scy = H + 6, rx = W * 0.44, ry = H * 1.08;
    const pt = t => {
      const a = Math.PI + t * Math.PI;
      return { x: scx + rx * Math.cos(a), y: scy + ry * Math.sin(a) };
    };
    const arc = (t0, t1, n = 60) => {
      let d = '';
      for (let i = 0; i <= n; i++) {
        const p = pt(t0 + (t1 - t0) * i / n);
        d += (i ? 'L' : 'M') + `${p.x.toFixed(1)},${p.y.toFixed(1)} `;
      }
      return d;
    };
    document.getElementById('arcTrack').setAttribute('d', arc(0, 1));
    document.getElementById('arcDone').setAttribute('d',  arc(0, prog));
    const sp = pt(prog);
    document.getElementById('sunDot').setAttribute('cx', sp.x.toFixed(1));
    document.getElementById('sunDot').setAttribute('cy', sp.y.toFixed(1));
  }

  // ── MAREA ──
  const frac = Math.max(0, Math.min(1, (Date.now() - tideData.lastTs) / tideData.cycleTotal));
  const fillPct = (frac * 86 + 7).toFixed(1) + '%';
  document.getElementById('tideFill').style.width  = fillPct;
  document.getElementById('tideCursor').style.left = fillPct;

  const dir = tideData.rising ? '↑ subiendo' : '↓ bajando';
  document.getElementById('tideNowDir').textContent = dir;

  const h = tideHeightNowClean();
  document.getElementById('tideNowVal').textContent = h != null ? h.toFixed(1) + ' m' : '--';

  if (tideData.rising) {
    document.getElementById('tideLeftLabel').textContent = 'bajamar';
    document.getElementById('tideLeftTime').textContent  = fmt(tideData.lastTs);
    document.getElementById('tideLeftM').textContent     = tideData.lastHeight != null ? tideData.lastHeight.toFixed(1) + ' m' : '';
    document.getElementById('tideRightLabel').textContent = 'pleamar';
    document.getElementById('tideRightTime').textContent  = fmt(tideData.nextTs);
    document.getElementById('tideRightM').textContent     = tideData.nextHeight != null ? tideData.nextHeight.toFixed(1) + ' m' : '';
  } else {
    document.getElementById('tideLeftLabel').textContent = 'pleamar';
    document.getElementById('tideLeftTime').textContent  = fmt(tideData.lastTs);
    document.getElementById('tideLeftM').textContent     = tideData.lastHeight != null ? tideData.lastHeight.toFixed(1) + ' m' : '';
    document.getElementById('tideRightLabel').textContent = 'bajamar';
    document.getElementById('tideRightTime').textContent  = fmt(tideData.nextTs);
    document.getElementById('tideRightM').textContent     = tideData.nextHeight != null ? tideData.nextHeight.toFixed(1) + ' m' : '';
  }

  // ── LUNA ──
  const moon = moonPhase(Date.now());
  document.getElementById('moonName').textContent = moon.name;
  document.getElementById('moonPct').textContent  = moon.illum + '% iluminada';

  // Dibujar fase lunar en SVG
  const phase = moon.phase; // 0=nueva, 0.5=llena, 1=nueva
  const cx = 15, cy = 15, r = 11;
  let moonD;
  if (phase < 0.5) {
    // Creciente: parte derecha iluminada
    const k = Math.cos(Math.PI * phase * 2);
    moonD = `M ${cx} ${cy-r} A ${r} ${r} 0 0 1 ${cx} ${cy+r} A ${r*Math.abs(k)} ${r} 0 0 ${k>0?0:1} ${cx} ${cy-r} Z`;
  } else {
    // Menguante: parte izquierda iluminada
    const k = Math.cos(Math.PI * (phase - 0.5) * 2);
    moonD = `M ${cx} ${cy-r} A ${r} ${r} 0 0 0 ${cx} ${cy+r} A ${r*Math.abs(k)} ${r} 0 0 ${k>0?1:0} ${cx} ${cy-r} Z`;
  }
  document.getElementById('moonPath').setAttribute('d', moonD);
  document.getElementById('moonPath').setAttribute('fill', 'rgba(200,216,240,0.55)');

  // Puntos del ciclo lunar
  const dotsEl = document.getElementById('lunarDots');
  dotsEl.innerHTML = '';
  const N = 15, active = Math.round(moon.illum / 100 * N);
  for (let i = 0; i < N; i++) {
    const d = document.createElement('div');
    d.className = 'ldot' + (i < active ? ' on' : '');
    dotsEl.appendChild(d);
  }

  // Mostrar la tarjeta
  document.getElementById('info-card').classList.add('visible');
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER — lógica visual (sin cambios respecto al original)
// ─────────────────────────────────────────────────────────────────────────────
function buildScanOrder() {
  const o = [];
  for (let row = ROWS-1; row >= 0; row--)
    for (let col = 0; col < COLS; col++)
      o.push(row * COLS + col);
  return o;
}


const ORDER_UP   = buildScanOrder();
const ORDER_DOWN = [...ORDER_UP].reverse();

// Mapas inversos idx→posición precalculados una sola vez.
// order.map() dentro de draw() recreaba el Map 60 veces/segundo — innecesario
// porque ORDER_UP y ORDER_DOWN nunca cambian.
const WAVE_POS_UP   = new Map(ORDER_UP.map((idx, pos)   => [idx, pos]));
const WAVE_POS_DOWN = new Map(ORDER_DOWN.map((idx, pos) => [idx, pos]));

// Cache de litSet: evita recrear el Set 60 veces/segundo.
// litCount cambia como mucho una vez por segundo, no 60 veces.
let _cachedLitCount = -1;
let _cachedLitSet   = new Set();

function lerp3(a, b, t) {
  t = Math.max(0, Math.min(1, t));
  return [
    Math.round(a[0] + (b[0]-a[0]) * t),
    Math.round(a[1] + (b[1]-a[1]) * t),
    Math.round(a[2] + (b[2]-a[2]) * t),
  ];
}

// ox, oy = origen del grid precalculado en draw() — evita recalcular 64 veces/frame
function drawPixel(row, col, color, ox, oy) {
  const x = ox + col * (SIZE + GAP);
  const y = oy + row * (SIZE + GAP);
  const [r, g, b] = color;

  ctx.fillStyle   = `rgb(${r},${g},${b})`;
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth   = 1.5;
  ctx.beginPath();
  if (col % 2 === 0) {
    ctx.moveTo(x,        y + LIFT);
    ctx.lineTo(x + SIZE, y);
    ctx.lineTo(x + SIZE, y + SIZE);
    ctx.lineTo(x,        y + SIZE + LIFT);
  } else {
    ctx.moveTo(x,        y);
    ctx.lineTo(x + SIZE, y + LIFT);
    ctx.lineTo(x + SIZE, y + SIZE + LIFT);
    ctx.lineTo(x,        y + SIZE);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}

function draw(litCount, rising, wavePos) {
  ctx.clearRect(0, 0, W, H);

  // litSet cacheado: solo se regenera cuando litCount cambia (no 60 veces/segundo)
  if (litCount !== _cachedLitCount) {
    _cachedLitSet   = new Set(ORDER_UP.slice(0, litCount));
    _cachedLitCount = litCount;
  }
  const litSet = _cachedLitSet;

  const order    = rising ? ORDER_UP : ORDER_DOWN;
  // BUG 1+2 FIX: usar TOTAL (64) en lugar de TOTAL-1 (63) como multiplicador.
  // Con TOTAL-1, wavePos∈[0,1) → headI∈[0,62.x] → el píxel en posición 63
  // (abajo-izquierda al bajar, arriba-derecha al subir) nunca recibe dist≈0
  // y nunca se ilumina. Con TOTAL, headI puede llegar a 63.x → dist<1 → flash correcto.
  const headI    = wavePos * TOTAL;
  // Parámetro 2: tamaño de la cola de ola en píxeles
  // 0.5m→1px, 1m→2px, 2m→4px, 4m→8px — escala natural para el Cantábrico
  const WAVE_LEN = Math.max(1, Math.min(8, Math.round(waveHeightM * 2)));

  // Paleta una sola vez por frame, no 64
  const { on, off, flash: fc } = getColors();

  // Mapa inverso precalculado (no se recrea en cada frame)
  const waveOrderPos = rising ? WAVE_POS_UP : WAVE_POS_DOWN;

  // Coordenadas de origen del grid precalculadas una vez por frame
  // El grid se desplaza hacia arriba para dejar espacio a la tarjeta inferior (~186px)
  // cuando está visible. Usamos cardH para el offset dinámico.
  const gridW = COLS * SIZE + (COLS - 1) * GAP;
  const gridH = ROWS * SIZE + (ROWS - 1) * GAP + LIFT;
  const cardEl = document.getElementById('info-card');
  const cardH  = cardEl.classList.contains('visible') ? cardEl.offsetHeight : 0;
  const ox = (W - gridW) / 2;
  const oy = (H - gridH) / 2 - cardH / 2;

  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const idx  = row * COLS + col;
      const isOn = litSet.has(idx);
      const base = isOn ? on : off;

      const waveI = waveOrderPos.get(idx);
      const dist  = headI - waveI;
      let flash   = 0;
      if (dist >= 0 && dist <= WAVE_LEN) flash = Math.pow(1 - dist / WAVE_LEN, 2);

      const color = lerp3(base, fc, flash * 0.95);

      if (flash > 0.1) { ctx.shadowColor = `rgba(200,240,255,${flash * 0.5})`; ctx.shadowBlur = 14 * flash; }
      else ctx.shadowBlur = 0;

      drawPixel(row, col, color, ox, oy);
    }
  }
  ctx.shadowBlur = 0;
}

// ─────────────────────────────────────────────────────────────────────────────
// PWA — service worker y fullscreen
// NOTA: mantenemos el desregistro del SW para evitar que una versión vieja
// del SW sirva HTML obsoleto. La caché real de datos de marea está en
// localStorage (no en el SW cache), así que este unregister no afecta a los
// datos de marea.
// ─────────────────────────────────────────────────────────────────────────────
function goFullscreen() {
  const el = document.documentElement;
  if (el.requestFullscreen)       el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}
document.addEventListener('click', goFullscreen);
goFullscreen();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
  caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
}

// Refrescar datos cuando la app vuelve al primer plano
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  // Solo refrescamos si la caché está caducada
  const cached = loadCache();
  if (!cached) fetchMarineData();
  else {
    // Aunque la caché sea válida, re-procesamos para actualizar el estado en memoria
    // (tideData puede haberse perdido si el dispositivo mató el proceso)
    if (!tideData) processTideExtremes(cached.extremes, cached.source + '(caché)');
  }
});

// Refresco periódico cada hora — referencia guardada para evitar acumulación
const _refreshInterval = setInterval(fetchMarineData, 60 * 60 * 1000);

// Actualizar la tarjeta cada minuto (sol y altura de marea cambian gradualmente)
setInterval(updateCard, 60000);

// ─────────────────────────────────────────────────────────────────────────────
// SWIPE GESTUAL — deslizar en cualquier parte de la pantalla
// Arriba → mostrar tarjeta  |  Abajo → ocultar tarjeta
// ─────────────────────────────────────────────────────────────────────────────
let _swipeStartY = null;
const SWIPE_THRESHOLD = 40;

document.addEventListener('touchstart', e => {
  _swipeStartY = e.touches[0].clientY;
  _swipeConsumed = false;
}, { passive: true });

document.addEventListener('touchend', e => {
  if (_swipeStartY === null) return;
  const dy = _swipeStartY - e.changedTouches[0].clientY;
  if (Math.abs(dy) < SWIPE_THRESHOLD) { _swipeStartY = null; return; }
  _swipeConsumed = true;
  const card = document.getElementById('info-card');
  if (dy > 0) card.classList.add('visible');
  else        card.classList.remove('visible');
  _swipeStartY = null;
}, { passive: true });

// ─────────────────────────────────────────────────────────────────────────────
// ARRANQUE
// ─────────────────────────────────────────────────────────────────────────────
fetchMarineData();

function loop(ts) {
  const wavePos = (ts % wavePeriodMs) / wavePeriodMs;
  draw(computeLitCount(), tideData ? tideData.rising : true, wavePos);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
